    <path d="M 6 40 C 10 42, 17 41, 23 35 C 26 32, 28 28, 27 25" stroke="url(#apple-orbit)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 7 34 C 11 35, 16 33, 20 28" stroke="url(#apple-orbit)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 39 9 L 11 20 L 23 27 Z" fill="url(#apple-top)"/>
    <path d="M 39 9 L 23 27 L 29 37 Z" fill="url(#apple-bot)"/>
    <path d="M 39 9 L 23 27 L 24.5 25 L 34 14 Z" fill="url(#apple-keel)" opacity="0.95"/>
    <path d="M 23 27 L 20 30 L 22 26 Z" fill="#06B6D4" opacity="0.85"/>
    <circle cx="39" cy="9" r="1.6" fill="#FFFFFF"/>
    <circle cx="39" cy="9" r="3" stroke="#38BDF8" stroke-width="0.8" opacity="0.9" fill="none"/>
