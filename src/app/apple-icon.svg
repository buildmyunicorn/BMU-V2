<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none" width="180" height="180">
  <defs>
    <linearGradient id="apple-bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="apple-top" x1="41" y1="75" x2="146" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="apple-bot" x1="86" y1="101" x2="146" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="50%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="apple-keel" x1="86" y1="101" x2="146" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="apple-orbit" x1="22" y1="154" x2="101" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="180" height="180" rx="40" fill="url(#apple-bg)"/>
  <rect width="176" height="176" x="2" y="2" rx="38" stroke="#312E81" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Centered Scaled Mark (scale ~3.75x) -->
