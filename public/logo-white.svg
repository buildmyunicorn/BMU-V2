<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" fill="none" width="260" height="48">
  <defs>
    <linearGradient id="spf-w-top" x1="11" y1="20" x2="39" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="spf-w-bot" x1="23" y1="27" x2="39" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="spf-w-keel" x1="23" y1="27" x2="39" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="spf-w-orbit" x1="6" y1="41" x2="27" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="1"/>
    </linearGradient>
    <filter id="spf-w-glow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Aerodynamic Mark Group -->
  <g transform="translate(0, 0)">
    <path d="M 6 40 C 10 42, 17 41, 23 35 C 26 32, 28 28, 27 25" stroke="url(#spf-w-orbit)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 7 34 C 11 35, 16 33, 20 28" stroke="url(#spf-w-orbit)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 39 9 L 11 20 L 23 27 Z" fill="url(#spf-w-top)"/>
    <path d="M 39 9 L 23 27 L 29 37 Z" fill="url(#spf-w-bot)"/>
    <path d="M 39 9 L 23 27 L 24.5 25 L 34 14 Z" fill="url(#spf-w-keel)" opacity="0.95"/>
    <path d="M 23 27 L 20 30 L 22 26 Z" fill="#38BDF8" opacity="0.9"/>
    <g filter="url(#spf-w-glow)">
      <circle cx="39" cy="9" r="1.5" fill="#FFFFFF"/>
      <circle cx="39" cy="9" r="3" stroke="#38BDF8" stroke-width="0.8" opacity="0.9" fill="none"/>
    </g>
  </g>

  <!-- Wordmark for Dark Backgrounds -->
  <text x="56" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="-0.03em" fill="#FFFFFF">
    Startup<tspan fill="#818CF8" dx="4">Preflight</tspan>
  </text>
  <text x="56.5" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.12em" fill="#94A3B8">
    SUPPORTIVE CO-FOUNDER &amp; BLIND-SPOT ENGINE
  </text>
</svg>
